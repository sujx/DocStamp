# ───────────────────────────────────────────────────────────────────
# docStamp Lite — 精简 Docker 编排（3 容器，适配 2C2G 低配服务器）
#
# 与 full 模式（6 容器，docker-compose.yml）的区别：
#   - 3 个 Celery 队列合并为 1 个 Worker 处理（concurrency=2）
#   - Beat 内嵌在 Worker 中（-B 参数），不单独跑容器
#   - 内存占用 ~800MB（含 LibreOffice 按需调用）
#
# 使用：
#   docker compose -f docker-compose.lite.yml up -d
# ───────────────────────────────────────────────────────────────────

services:
  # ── Shared Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: docstamp-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── Flask API + 静态文件 ──────────────────────────────────────────
  api:
    build: .
    container_name: docstamp-api
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - output_data:/opt/docstamp/backend/output
      - log_data:/var/log/docstamp
    environment:
      - TZ=Asia/Shanghai
      - DOCSTAMP_STATIC=/opt/docstamp/frontend/.output/public
      - DOCSTAMP_ENCRYPTION_KEY=${DOCSTAMP_ENCRYPTION_KEY:-}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DOCSTAMP_CORS_ORIGINS=${DOCSTAMP_CORS_ORIGINS:-http://localhost:8080}
      - PYTHONPATH=/opt/docstamp/backend
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Gunicorn with 2 workers for low memory
    command: >
      gunicorn -c backend/gunicorn.conf.py
      -b 0.0.0.0:5000 --workers 2
      --pid /tmp/gunicorn.pid
      backend.app:app

  # ── Celery All-in-One (3 队列合并 + Beat 内嵌) ────────────────────
  celery:
    build: .
    container_name: docstamp-celery
    command: >
      celery -A backend.celery_app worker
      -Q convert_queue,pdf_queue,office_queue
      --concurrency=2
      -B --loglevel=info
    volumes:
      - output_data:/opt/docstamp/backend/output
      - log_data:/var/log/docstamp
    environment:
      - TZ=Asia/Shanghai
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DOCSTAMP_ENCRYPTION_KEY=${DOCSTAMP_ENCRYPTION_KEY:-}
      - PYTHONPATH=/opt/docstamp/backend
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.celery_app inspect ping -t 5 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    mem_limit: 512M

volumes:
  output_data:
  log_data:
  redis_data:
