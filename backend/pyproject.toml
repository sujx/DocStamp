[tool.poetry]
name = "docstamp-backend"
version = "1.0.0"
description = "docStamp Document Processing Toolbox - Flask REST API backend"
authors = ["sujx <sujx@live.cn>"]
readme = "../README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
flask = "^3.1"
flask-cors = "^5.0"
flask-babel = "^4.0"
flask-caching = "^2.4"
python-docx = "^1.1"
openpyxl = "^3.1"
python-pptx = "^1.0"
img2pdf = "^0.5"
pypdf = "^5.0"
Pillow = "^10.0"
reportlab = "^4.0"
gunicorn = "^23.0"
pydantic = "^2.13"
cryptography = "^48.0"
weasyprint = "^63.0"
markdown = "^3.7"
bleach = "^6.0"
pdfminer-six = "^20240706"
requests = "^2.32"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-flask = "^1.3"
pytest-cov = "^6.0"
black = "^24.0"
flake8 = "^7.0"
isort = "^5.13"
mypy = "^1.8"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
ignore_missing_imports = true
strict = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
