[project]
name = "docstamp-backend"
version = "1.0.0"
description = "docStamp Document Processing Toolbox - Flask REST API backend"
authors = [{ name = "sujx", email = "sujx@live.cn" }]
readme = "../README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1,<4",
    "flask-cors>=5.0,<6",
    "flask-babel>=4.0,<5",
    "flask-caching>=2.4,<3",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "python-pptx>=1.0,<2",
    "img2pdf>=0.5,<0.6",
    "pypdf>=5.0,<6",
    "pillow>=11.0,<12",
    "reportlab>=4.0,<5",
    "gunicorn>=23.0,<24",
    "pydantic>=2.13,<3",
    "cryptography>=48.0,<49",
    "markdown>=3.7,<4",
    "bleach>=6.0,<7",
    "pdfminer-six>=20240706,<20250000",
    # AGPL-3.0 — used by the PDF redaction tool; source is public, owner approved
    "pymupdf>=1.24,<2",
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-flask>=1.3,<2",
    "pytest-cov>=6.0,<7",
    "black>=24.0,<25",
    "flake8>=7.0,<8",
    "isort>=5.13,<6",
    "mypy>=1.8,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
ignore_missing_imports = true
strict = true
