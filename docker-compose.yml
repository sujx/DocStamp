services:
  # ── Shared Redis (Celery broker + result backend + cache) ──────────
  redis:
    image: redis:7-alpine
    container_name: docstamp-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── Flask API + static files ───────────────────────────────────────
  api:
    build: .
    container_name: docstamp-api
    ports:
      - "127.0.0.1:5000:5000"       # Only reachable via reverse proxy
    volumes:
      - output_data:/opt/docstamp/backend/output
      - log_data:/var/log/docstamp
    environment:
      - TZ=Asia/Shanghai
      - DOCSTAMP_STATIC=/opt/docstamp/frontend/.output/public
      - DOCSTAMP_ENCRYPTION_KEY=${DOCSTAMP_ENCRYPTION_KEY:-}
      - AI_API_URL=${AI_API_URL:-https://api.deepseek.com/chat/completions}
      - AI_MODEL=${AI_MODEL:-deepseek-chat}
      - DOCSTAMP_DEEPSEEK_API_KEY=${DOCSTAMP_DEEPSEEK_API_KEY:-}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DOCSTAMP_CORS_ORIGINS=${DOCSTAMP_CORS_ORIGINS:-http://localhost:8080}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Celery workers (one per queue to isolate resource usage) ───────
  celery-convert:
    build: .
    container_name: docstamp-celery-convert
    command: >
      celery -A backend.celery_app worker
      -Q convert_queue --concurrency=4
      -n convert@%h --loglevel=info
    volumes:
      - output_data:/opt/docstamp/backend/output
      - log_data:/var/log/docstamp
    environment:
      - TZ=Asia/Shanghai
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DOCSTAMP_ENCRYPTION_KEY=${DOCSTAMP_ENCRYPTION_KEY:-}
      - PYTHONPATH=/opt/docstamp/backend
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.celery_app inspect ping -t 5 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  celery-pdf:
    build: .
    container_name: docstamp-celery-pdf
    command: >
      celery -A backend.celery_app worker
      -Q pdf_queue --concurrency=4
      -n pdf@%h --loglevel=info
    volumes:
      - output_data:/opt/docstamp/backend/output
      - log_data:/var/log/docstamp
    environment:
      - TZ=Asia/Shanghai
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DOCSTAMP_ENCRYPTION_KEY=${DOCSTAMP_ENCRYPTION_KEY:-}
      - PYTHONPATH=/opt/docstamp/backend
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.celery_app inspect ping -t 5 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  celery-office:
    build: .
    container_name: docstamp-celery-office
    command: >
      celery -A backend.celery_app worker
      -Q office_queue --concurrency=4
      -n office@%h --loglevel=info
    volumes:
      - output_data:/opt/docstamp/backend/output
      - log_data:/var/log/docstamp
    environment:
      - TZ=Asia/Shanghai
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DOCSTAMP_ENCRYPTION_KEY=${DOCSTAMP_ENCRYPTION_KEY:-}
      - PYTHONPATH=/opt/docstamp/backend
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.celery_app inspect ping -t 5 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  celery-beat:
    build: .
    container_name: docstamp-celery-beat
    command: celery -A backend.celery_app beat --loglevel=info
    volumes:
      - output_data:/opt/docstamp/backend/output
      - log_data:/var/log/docstamp
    environment:
      - TZ=Asia/Shanghai
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - PYTHONPATH=/opt/docstamp/backend
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery beat' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  output_data:
  log_data:
  redis_data:
