services:
  docstamp:
    build: .
    container_name: docstamp
    ports:
      - "8050:5000"
    volumes:
      - output_data:/opt/docstamp/output
      - log_data:/var/log/docstamp
    environment:
      - TZ=Asia/Shanghai
      - DOCSTAMP_STATIC=/opt/docstamp/frontend/.output/public
      - DOCSTAMP_ENCRYPTION_KEY=${DOCSTAMP_ENCRYPTION_KEY:-}
    restart: unless-stopped

volumes:
  output_data:
  log_data:
