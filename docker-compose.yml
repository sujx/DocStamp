# ───────────────────────────────────────────────────────────────────
# docStamp — Docker 部署（单容器，适配 2C2G 服务器）
#
# 容器：Flask API (gunicorn)，每日临时文件清理由 gunicorn on_starting
# 启动的守护线程负责（见 backend/gunicorn.conf.py）
#
# 使用：
#   1. 复制 .env.example → .env 并填写配置
#   2. docker compose up -d --build
#   3. 配置 nginx 反向代理到 127.0.0.1:5000
#
# 资源：API 2 workers → ~200MB
# ───────────────────────────────────────────────────────────────────

services:
  # ── Flask API + 前端静态文件 ──────────────────────────────────────
  api:
    build: .
    # build 供本地从源码起（./manage.sh docker-up）；image 是 ACR 上的发布名 ——
    # 镜像推上去后，ECS 上只需 docker compose pull 就能更新。
    image: registry.cn-wulanchabu.aliyuncs.com/grepsu/docstamp:latest
    container_name: docstamp-api
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - output_data:/opt/docstamp/backend/output
      - log_data:/var/log/docstamp
      - db_data:/opt/docstamp/backend/data
    environment:
      - TZ=Asia/Shanghai
      - DOCSTAMP_STATIC=/opt/docstamp/frontend/.output/public
      - DOCSTAMP_ENCRYPTION_KEY=${DOCSTAMP_ENCRYPTION_KEY:-}
      - DOCSTAMP_CORS_ORIGINS=${DOCSTAMP_CORS_ORIGINS:-http://localhost:8080,https://doc.sujx.net}
      - DOCSTAMP_TASK_DB=/opt/docstamp/backend/data/tasks.db
      - PYTHONPATH=/opt/docstamp/backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: >
      gunicorn -c backend/gunicorn.conf.py
      -b 0.0.0.0:5000 --workers 2
      --pid /tmp/gunicorn.pid
      backend.wsgi:app

volumes:
  output_data:
  log_data:
  db_data:
