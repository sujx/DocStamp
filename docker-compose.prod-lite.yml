# ───────────────────────────────────────────────────────────────────
# docStamp Lite 生产部署（3 容器，2C2G ECS）—— 使用 ACR 预构建镜像
#
# 发布流程：
#   1. 本地：./publish.sh
#   2. ECS：scp docker-compose.prod-lite.yml .env root@你的ECS:/opt/docstamp/
#   3. ECS：docker compose -f docker-compose.prod-lite.yml up -d
#
# 与 Full 模式（docker-compose.prod.yml）区别：
#   - 3 容器 vs 6 容器
#   - 1 个 Celery Worker 处理所有队列（concurrency=2）
#   - Beat 内嵌在 Worker 中
#   - 内存 ~800MB
# ───────────────────────────────────────────────────────────────────
x-image: &image registry.cn-wulanchabu.aliyuncs.com/grepsu/docstamp:latest

services:
  redis:
    image: redis:7-alpine
    container_name: docstamp-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    image: *image
    container_name: docstamp-api
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - output_data:/opt/docstamp/backend/output
      - log_data:/var/log/docstamp
    environment:
      - TZ=Asia/Shanghai
      - DOCSTAMP_STATIC=/opt/docstamp/frontend/.output/public
      - DOCSTAMP_ENCRYPTION_KEY=${DOCSTAMP_ENCRYPTION_KEY:-}
      - AI_API_URL=${AI_API_URL:-https://api.deepseek.com/chat/completions}
      - AI_MODEL=${AI_MODEL:-deepseek-v4-flash}
      - DOCSTAMP_DEEPSEEK_API_KEY=${DOCSTAMP_DEEPSEEK_API_KEY:-}
      - DOCSTAMP_MINERU_API_KEY=${DOCSTAMP_MINERU_API_KEY:-}
      - DOCSTAMP_PUBLIC_URL=${DOCSTAMP_PUBLIC_URL:-}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DOCSTAMP_CORS_ORIGINS=${DOCSTAMP_CORS_ORIGINS:-http://localhost:8080}
      - PYTHONPATH=/opt/docstamp/backend
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: >
      gunicorn -c backend/gunicorn.conf.py
      -b 0.0.0.0:5000 --workers 2
      --pid /tmp/gunicorn.pid
      backend.app:app

  celery:
    image: *image
    container_name: docstamp-celery
    command: >
      celery -A backend.celery_app worker
      -Q convert_queue,pdf_queue,office_queue
      --concurrency=2
      -B --loglevel=info
    volumes:
      - output_data:/opt/docstamp/backend/output
      - log_data:/var/log/docstamp
    environment:
      - TZ=Asia/Shanghai
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DOCSTAMP_ENCRYPTION_KEY=${DOCSTAMP_ENCRYPTION_KEY:-}
      - PYTHONPATH=/opt/docstamp/backend
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.celery_app inspect ping -t 5 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    mem_limit: 512M

volumes:
  output_data:
  log_data:
  redis_data:
