# ───────────────────────────────────────────────────────────────────
# 生产部署用 — 使用预构建镜像，不在 ECS 上编译前端。
#
# 发布流程：
#   1. 本地构建：docker compose -f docker-compose.prod.yml build
#   2. 打标签：  docker tag docstamp-api:latest <registry>/docstamp:latest
#   3. 推送到 Registry：docker push <registry>/docstamp:latest
#   4. ECS 拉取：docker compose -f docker-compose.prod.yml up -d
#
# 使用前替换下面 REGISTRY 为你的阿里云 ACR 地址，例如：
#   registry.cn-hangzhou.aliyuncs.com/你的命名空间/docstamp
# ───────────────────────────────────────────────────────────────────
x-image: &image registry.cn-wulanchabu.aliyuncs.com/grepsu/docstamp:latest

services:
  redis:
    image: redis:7-alpine
    container_name: docstamp-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    image: *image
    container_name: docstamp-api
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - output_data:/opt/docstamp/backend/output
      - log_data:/var/log/docstamp
      - db_data:/opt/docstamp/backend/data
    environment:
      - TZ=Asia/Shanghai
      - DOCSTAMP_STATIC=/opt/docstamp/frontend/.output/public
      - DOCSTAMP_ENCRYPTION_KEY=${DOCSTAMP_ENCRYPTION_KEY:-}
      - AI_API_URL=${AI_API_URL:-https://api.deepseek.com/chat/completions}
      - AI_MODEL=${AI_MODEL:-deepseek-v4-flash}
      - DOCSTAMP_DEEPSEEK_API_KEY=${DOCSTAMP_DEEPSEEK_API_KEY:-}
      - DOCSTAMP_MINERU_API_KEY=${DOCSTAMP_MINERU_API_KEY:-}
      - DOCSTAMP_PUBLIC_URL=${DOCSTAMP_PUBLIC_URL:-}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DOCSTAMP_CORS_ORIGINS=${DOCSTAMP_CORS_ORIGINS:-http://localhost:8080}
      - DOCSTAMP_TASK_DB=/opt/docstamp/backend/data/tasks.db
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  celery-convert:
    image: *image
    container_name: docstamp-celery-convert
    command: >
      celery -A backend.celery_app worker
      -Q convert_queue --concurrency=4
      -n convert@%h --loglevel=info
    volumes:
      - output_data:/opt/docstamp/backend/output
      - log_data:/var/log/docstamp
      - db_data:/opt/docstamp/backend/data
    environment:
      - TZ=Asia/Shanghai
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DOCSTAMP_ENCRYPTION_KEY=${DOCSTAMP_ENCRYPTION_KEY:-}
      - DOCSTAMP_TASK_DB=/opt/docstamp/backend/data/tasks.db
      - PYTHONPATH=/opt/docstamp/backend
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-pdf:
    image: *image
    container_name: docstamp-celery-pdf
    command: >
      celery -A backend.celery_app worker
      -Q pdf_queue --concurrency=4
      -n pdf@%h --loglevel=info
    volumes:
      - output_data:/opt/docstamp/backend/output
      - log_data:/var/log/docstamp
      - db_data:/opt/docstamp/backend/data
    environment:
      - TZ=Asia/Shanghai
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DOCSTAMP_ENCRYPTION_KEY=${DOCSTAMP_ENCRYPTION_KEY:-}
      - DOCSTAMP_TASK_DB=/opt/docstamp/backend/data/tasks.db
      - PYTHONPATH=/opt/docstamp/backend
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-office:
    image: *image
    container_name: docstamp-celery-office
    command: >
      celery -A backend.celery_app worker
      -Q office_queue --concurrency=4
      -n office@%h --loglevel=info
    volumes:
      - output_data:/opt/docstamp/backend/output
      - log_data:/var/log/docstamp
      - db_data:/opt/docstamp/backend/data
    environment:
      - TZ=Asia/Shanghai
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DOCSTAMP_ENCRYPTION_KEY=${DOCSTAMP_ENCRYPTION_KEY:-}
      - DOCSTAMP_TASK_DB=/opt/docstamp/backend/data/tasks.db
      - PYTHONPATH=/opt/docstamp/backend
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    image: *image
    container_name: docstamp-celery-beat
    command: celery -A backend.celery_app beat --loglevel=info
    volumes:
      - output_data:/opt/docstamp/backend/output
      - log_data:/var/log/docstamp
      - db_data:/opt/docstamp/backend/data
    environment:
      - TZ=Asia/Shanghai
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DOCSTAMP_TASK_DB=/opt/docstamp/backend/data/tasks.db
      - PYTHONPATH=/opt/docstamp/backend
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  output_data:
  log_data:
  redis_data:
  db_data:
