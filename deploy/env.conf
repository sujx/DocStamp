# 鹊随金印 生产环境变量（Systemd 部署用）
# 复制到 /etc/docstamp/env.conf 后填入真实值。
# ⚠️ 此文件是模板——不要在此填入真实 Key，否则会被提交到代码库。
#
# Docker 部署请使用项目根目录的 .env 文件（从 .env.example 复制）。

# AES-256 加密密钥
DOCSTAMP_ENCRYPTION_KEY=

# AI features (text correction, format detection, denoise).
# Supports OpenAI / DeepSeek / Ollama / any OpenAI-compatible API.
# Leave key empty to disable AI — endpoints return unchanged input.
AI_API_URL=https://api.deepseek.com/chat/completions
AI_MODEL=deepseek-chat
# MinerU API key for document-to-Markdown conversion
DOCSTAMP_MINERU_API_KEY=
DOCSTAMP_DEEPSEEK_API_KEY=

# Celery broker — Redis (production default)
CELERY_BROKER_URL=redis://127.0.0.1:6379/0
CELERY_RESULT_BACKEND=redis://127.0.0.1:6379/1

# CORS — comma-separated list of allowed origins
DOCSTAMP_CORS_ORIGINS=https://your-domain.com

# Static files directory (Nuxt generate output)
DOCSTAMP_STATIC=/opt/docstamp/frontend/.output/public

# Upload storage directory
DOCSTAMP_UPLOAD_FOLDER=/opt/docstamp/output

# Log directory
DOCSTAMP_LOG_DIR=/var/log/docstamp
DOCSTAMP_LOG_LEVEL=20
